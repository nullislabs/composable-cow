name: test

on:
  # Unfiltered: a stacked PR targets its parent branch, not `develop`, so a
  # `branches: [develop]` filter would only ever check the head of the train.
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

# Supersede in-flight runs: a rebased train force-pushes every branch at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          # Bytecode is pinned by `solc_version` in foundry.toml, so the forge
          # version affects tooling rather than output.
          version: stable

      - name: Show versions
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        # `fork` needs an archive-node RPC and is not run here. The fuzz seed is
        # pinned so a failure is reproducible from the log alone.
        run: forge test -vvv --no-match-test "fork" --fuzz-seed 672679878
