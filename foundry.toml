[profile.default]
src = 'src'
out = 'out'
libs = ['lib']

solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = true

# Descriptor documents are read by test/ComposableCow.descriptorDoc.t.sol
fs_permissions = [{ access = "read", path = "./descriptors" }]

[profile.default.model_checker]
contracts = { 'src/types/twap/libraries/TWAPOrderMathLib.sol' = [ 'TWAPOrderMathLib' ] }
engine = 'chc'
targets = [
    'assert', 'underflow', 'overflow', 'divByZero', 'constantCondition', 'popEmptyArray', 'outOfBounds', 'balance'
]
timeout = 100000

[profile.ci]
verbosity = 3